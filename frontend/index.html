<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM-GOV1 Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F7;
    --bg-tint:#E3E9F4;
    --surface:#FFFFFF;
    --surface-2:#F7F9FC;
    --line:#E2E8F2;
    --line-soft:#EDF1F7;

    --ink:#16203A;
    --ink-2:#3D4A6B;
    --muted:#6B7899;
    --faint:#98A3BC;

    --brand:#2A4A9E;
    --brand-2:#4A72D6;
    --brand-tint:#EAF0FD;

    --teal:#0E8F86;
    --teal-tint:#E2F5F2;

    --success:#128A5E;
    --success-tint:#E3F5EC;
    --warning:#B87A0A;
    --warning-tint:#FDF1DC;
    --critical:#C4384A;
    --critical-tint:#FCE9EB;
    --neutral:#6B7899;
    --neutral-tint:#EDF0F6;

    --sh-sm:0 1px 2px rgba(22,32,58,.06), 0 1px 3px rgba(22,32,58,.04);
    --sh-md:0 1px 2px rgba(22,32,58,.05), 0 6px 16px -6px rgba(22,32,58,.14);
    --sh-lg:0 2px 4px rgba(22,32,58,.05), 0 14px 32px -12px rgba(22,32,58,.20);
    --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 82% -12%, #DDE6F8 0%, transparent 62%),
      radial-gradient(900px 420px at 8% -8%, #E6EDFA 0%, transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:26px 20px 56px;
    min-height:100vh;
  }
  .wrap{max-width:1340px;margin:0 auto;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .disp{font-family:'Plus Jakarta Sans',sans-serif;}
  svg.ico{width:16px;height:16px;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;}

  /* ---------------- Header ---------------- */
  .head{
    background:linear-gradient(140deg,#26417F 0%, #2F55A8 45%, #3C6BC4 100%);
    border-radius:16px;
    padding:24px 26px;
    color:#fff;
    box-shadow:var(--sh-lg);
    position:relative;
    overflow:hidden;
    display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between;
  }
  .head::after{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(520px 200px at 88% 0%, rgba(255,255,255,.16), transparent 65%),
      linear-gradient(90deg, transparent 62%, rgba(255,255,255,.05) 100%);
    pointer-events:none;
  }
  .head-l{display:flex;align-items:center;gap:16px;position:relative;z-index:1;min-width:280px;}
  .head-mark{
    width:50px;height:50px;border-radius:13px;flex:none;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.28);
    display:grid;place-items:center;
    backdrop-filter:blur(6px);
  }
  .head-mark svg{width:25px;height:25px;stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .head h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:23px;font-weight:800;letter-spacing:-.015em;}
  .head-sub{font-size:12.5px;color:rgba(255,255,255,.82);margin-top:5px;display:flex;align-items:center;gap:7px;}
  .live{width:7px;height:7px;border-radius:50%;background:#5BE8B0;box-shadow:0 0 0 3px rgba(91,232,176,.24);flex:none;}
  .live.off{background:rgba(255,255,255,.5);box-shadow:none;}

  .head-r{display:flex;gap:10px;align-items:stretch;position:relative;z-index:1;flex-wrap:wrap;}
  .stat{
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);
    border-radius:11px;padding:10px 15px;min-width:96px;
    backdrop-filter:blur(6px);
  }
  .stat .l{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:5px;}
  .stat .v{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:700;line-height:1.1;}
  .stat .v.sm{font-size:13px;font-weight:600;padding-top:5px;}
  .sync{
    background:rgba(255,255,255,.95);color:var(--brand);
    border:none;border-radius:11px;padding:0 17px;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:.16s;
  }
  .sync:hover:not(:disabled){background:#fff;transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(0,0,0,.4);}
  .sync:disabled{opacity:.72;cursor:default;}
  .sync svg{width:15px;height:15px;}

  /* ---------------- KPI ---------------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:15px;}
  @media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.kpis{grid-template-columns:1fr;}}
  .kpi{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 17px;box-shadow:var(--sh-md);position:relative;overflow:hidden;transition:.18s;
  }
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--brand));opacity:.9;}
  .kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .kpi-ico{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:var(--kt,var(--brand-tint));color:var(--kc,var(--brand));flex:none;}
  .kpi-ico svg{width:16px;height:16px;}
  .kpi-label{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3;}
  .kpi-val{font-family:'Plus Jakarta Sans',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.05;color:var(--ink);}
  .kpi-val .u{font-size:12.5px;font-weight:600;color:var(--faint);margin-left:5px;letter-spacing:0;}
  .kpi-val.money{font-size:20px;}
  .kpi-foot{font-size:11px;color:var(--faint);margin-top:7px;}

  /* ---------------- Panels ---------------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-md);margin-top:15px;overflow:hidden;}
  .p-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-soft);background:var(--surface-2);}
  .p-title{display:flex;align-items:center;gap:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;color:var(--ink);}
  .p-title svg{width:17px;height:17px;color:var(--brand);}
  .p-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);background:var(--bg-tint);padding:3px 9px;border-radius:20px;}
  .p-body{padding:16px 18px;}

  /* ---------------- Filters ---------------- */
  .filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line-soft);}
  .f-ico{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500;margin-right:2px;}
  .f-ico svg{width:15px;height:15px;color:var(--faint);}
  select{
    appearance:none;background:var(--surface);
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236B7899' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 9px center;
    border:1px solid var(--line);border-radius:8px;
    padding:7px 30px 7px 11px;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--ink-2);
    cursor:pointer;transition:.15s;box-shadow:var(--sh-sm);
  }
  select:hover{border-color:var(--brand-2);}
  select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint);}
  .reset{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;gap:6px;box-shadow:var(--sh-sm);transition:.15s;
  }
  .reset:hover{color:var(--brand);border-color:var(--brand-2);}
  .reset svg{width:13px;height:13px;}

  /* ---------------- Two-column row ---------------- */
  .row2{display:grid;grid-template-columns:1.55fr 1fr;gap:15px;margin-top:15px;}
  @media(max-width:960px){.row2{grid-template-columns:1fr;}}
  .row2 .panel{margin-top:0;}

  /* ---------------- Table ---------------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:10.5px;font-weight:600;color:var(--faint);
    text-transform:uppercase;letter-spacing:.07em;padding:0 10px 9px;border-bottom:1px solid var(--line);
  }
  th.r,td.r{text-align:right;}
  td{padding:12px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:.13s;}
  tbody tr:hover{background:var(--surface-2);}
  .who{display:flex;align-items:center;gap:10px;}
  .av{
    width:33px;height:33px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.02em;
    box-shadow:var(--sh-sm);
  }
  .who-n{font-weight:600;color:var(--ink);font-size:13px;line-height:1.3;}
  .who-t{font-size:11px;color:var(--faint);margin-top:1px;}
  .bar{height:6px;background:var(--bg-tint);border-radius:4px;overflow:hidden;margin-top:6px;min-width:74px;}
  .bar i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .pct{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--ink-2);}
  .money{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;}

  .risks{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;}
  .chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:4px 9px;border-radius:20px;white-space:nowrap;line-height:1;
  }
  .chip svg{width:12px;height:12px;stroke-width:2.2;}
  .chip.success{background:var(--success-tint);color:var(--success);}
  .chip.warning{background:var(--warning-tint);color:var(--warning);}
  .chip.critical{background:var(--critical-tint);color:var(--critical);}
  .chip.neutral{background:var(--neutral-tint);color:var(--neutral);}

  /* ---------------- Donut ---------------- */
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;padding:4px 0;}
  .legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px;min-width:150px;}
  .lg{display:flex;align-items:center;gap:9px;color:var(--ink-2);}
  .lg .sw{width:10px;height:10px;border-radius:3px;flex:none;}
  .lg .n{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);padding-left:16px;}
  .lg .p{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);width:38px;text-align:right;}

  /* ---------------- Project cards ---------------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(348px,1fr));gap:14px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 17px 15px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;transition:.18s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:#D5DEEC;}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc);}
  .c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .c-code{
    display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--muted);background:var(--surface-2);border:1px solid var(--line-soft);
    padding:3px 7px;border-radius:5px;
  }
  .c-code svg{width:11px;height:11px;}
  .c-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:var(--ink);margin-top:8px;line-height:1.32;letter-spacing:-.01em;}
  .c-cust{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:5px;}
  .c-cust svg{width:13px;height:13px;color:var(--faint);}
  .c-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .tag{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);
    background:var(--surface-2);border:1px solid var(--line-soft);padding:4px 8px;border-radius:6px;
  }
  .tag svg{width:12px;height:12px;color:var(--faint);}
  .c-prog{margin-top:13px;}
  .c-prog-t{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted);margin-bottom:5px;}
  .c-prog-t b{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:700;color:var(--ink);}
  .c-bar{height:7px;background:var(--bg-tint);border-radius:4px;overflow:hidden;}
  .c-bar i{display:block;height:100%;border-radius:4px;transition:width .55s cubic-bezier(.4,0,.2,1);}
  .c-note{
    margin-top:12px;font-size:12px;color:var(--ink-2);line-height:1.55;
    background:var(--surface-2);border-left:2px solid var(--line);padding:9px 11px;border-radius:0 7px 7px 0;
  }
  .c-foot{
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);
    font-size:11px;color:var(--faint);
  }
  .c-foot span{display:flex;align-items:center;gap:5px;}
  .c-foot svg{width:12px;height:12px;}

  .empty{padding:38px 20px;text-align:center;color:var(--faint);font-size:13px;}
  footer{margin-top:24px;text-align:center;font-size:11.5px;color:var(--faint);}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

      </div>
      <div class="p-body">
        <div class="donut-wrap">
          <svg id="donut" width="148" height="148" viewBox="0 0 148 148"></svg>
          <div class="legend" id="legend"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="p-head">
      <div class="p-title">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="M8 14h3M8 17h6"/></svg>

      </div>
      <span class="p-count" id="projCount"></span>
    </div>
    <div class="p-body"><div class="grid" id="grid"></div></div>
  </div>

  <footer>PM-GOV1 Progress Dashboard - ข้อมูลอัปเดตอัตโนมัติจาก Excel ผ่าน Make.com</footer>

    if (s.includes('critical') || s.includes('delay')) return 'critical';
    if (s.includes('warn')) return 'warning';
    if (s.includes('fast') || s.includes('track') || s.includes('good') || s.includes('normal')) return 'success';
    return 'neutral';
  },
  color(c){ return {success:'#128A5E', warning:'#B87A0A', critical:'#C4384A', neutral:'#8B95AD'}[c]; },
  icon(c){ return {success:I.check, warning:I.alert, critical:I.octagon, neutral:I.flag}[c]; },
  label(h){ return (h && String(h).trim()) ? h : 'ไม่ระบุ'; }
};

/* ---------- helpers ---------- */
const AV_COLORS = ['#2A4A9E','#0E8F86','#7A4BB5','#B8620A','#1E7BA6','#A63B62','#3F7A2E'];
function avatarColor(name){
  let h = 0; for (let i=0;i<(name||'').length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
function initials(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
const normKey = k => k.replace(/\s+/g,' ').trim();
const normRow = raw => { const o={}; for(const [k,v] of Object.entries(raw)) o[normKey(k)] = v; return o; };
function num(v){ const n = parseFloat(String(v).replace(/,/g,'')); return isNaN(n) ? 0 : n; }
function thb(v){ return new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(num(v)); }
function compact(v){
  const n = num(v);
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return String(n);
}
function fmtDate(v){
  if(!v) return '-';
  let d;
  if (/^\d{4}-\d{2}-\d{2}/.test(v)) d = new Date(v);
  else if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(v)){
    const [dd,mm,yyyy] = String(v).split('/');
    d = new Date(`${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`);
  } else d = new Date(v);
  if (isNaN(d)) return v;
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'});
}
const uniq = a => [...new Set(a.filter(v=>v!==undefined && v!==null && v!==''))];

/* ---------- state ---------- */
let ALL = [];
let filters = { team:'', vp:'', pm:'', status:'', health:'' };

async function loadData(){
  try{
    const res = await fetch(API_URL, { signal: AbortSignal.timeout(6000) });
    if(!res.ok) throw new Error('bad');
    const j = await res.json();
    const rows = j.rows || j;
    if(Array.isArray(rows) && rows.length){
      ALL = rows.map(normRow);
      setSource(true, j.updatedAt);
      render(); return;
    }
    throw new Error('empty');
  }catch(e){
    ALL = SEED_DATA.map(normRow);
    setSource(false, null);
    render();
  }
}
function setSource(live, updatedAt){
  document.getElementById('srcLine').innerHTML = live
    ? `<span class="live"></span>กำลังเชื่อมต่อแบบ real-time`
    : `<span class="live off"></span>ยังไม่เชื่อมต่อ API - แสดงข้อมูลตัวอย่าง`;
  document.getElementById('hUpdated').textContent = updatedAt
    ? fmtDate(updatedAt)
    : new Date().toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'});
}

const applyFilters = list => list.filter(p =>
  (!filters.team   || p['Team']==filters.team) &&
  (!filters.vp     || p['VP Name']==filters.vp) &&
  (!filters.pm     || p['PM Name']==filters.pm) &&
  (!filters.status || p['Status']==filters.status) &&
  (!filters.health || p['Project Health']==filters.health)
);

function buildFilters(){
  const defs = [
    {k:'team',   l:'ทีม',    v:uniq(ALL.map(p=>p['Team']))},
    {k:'vp',     l:'VP',     v:uniq(ALL.map(p=>p['VP Name']))},
    {k:'pm',     l:'PM',     v:uniq(ALL.map(p=>p['PM Name']))},
    {k:'status', l:'สถานะ',  v:uniq(ALL.map(p=>p['Status']))},
    {k:'health', l:'Health', v:uniq(ALL.map(p=>p['Project Health']))},
  ];
  const bar = document.getElementById('filters');
  bar.innerHTML = `<div class="f-ico">${svg(I.filter)}ตัวกรอง</div>` +
    defs.map(d=>`<select data-k="${d.k}"><option value="">${d.l}: ทั้งหมด</option>${
      d.v.map(x=>`<option value="${x}">${x}</option>`).join('')}</select>`).join('') +
    `<button class="reset" id="reset">${svg(I.reset)}ล้างตัวกรอง</button>`;

  bar.querySelectorAll('select').forEach(s=>
    s.addEventListener('change', ()=>{ filters[s.dataset.k]=s.value; renderFiltered(); }));
  document.getElementById('reset').addEventListener('click', ()=>{
    filters = { team:'', vp:'', pm:'', status:'', health:'' };
    bar.querySelectorAll('select').forEach(s=>s.value='');
    renderFiltered();
  });
}

function renderKPIs(list){
  const total = list.length;
  const inprog = list.filter(p=>/inprogress|กำลัง/i.test(p['Status']||'')).length;
  const avg = total ? list.reduce((s,p)=>s+num(p['%Progress']),0)/total : 0;
  const crit = list.filter(p=>H.cls(p['Project Health'])==='critical').length;
  const warn = list.filter(p=>H.cls(p['Project Health'])==='warning').length;
  const risk = crit + warn;
  const value = list.reduce((s,p)=>s+num(p['Contract Value']),0);

  const riskIco = crit ? I.octagon : (warn ? I.alert : I.check);
  const riskCol = crit ? '#C4384A' : (warn ? '#B87A0A' : '#128A5E');
  const riskTint = crit ? '#FCE9EB' : (warn ? '#FDF1DC' : '#E3F5EC');
  const riskFoot = risk ? `Critical ${crit} / Warning ${warn}` : 'ไม่มีโครงการเสี่ยง';

  const items = [
    {ic:I.folder,   c:'#2A4A9E', t:'#EAF0FD', l:'โครงการทั้งหมด',  v:total,             u:'',            f:`จากทั้งหมด ${ALL.length} โครงการ`},
    {ic:I.activity, c:'#0E8F86', t:'#E2F5F2', l:'กำลังดำเนินการ',  v:inprog,            u:`/ ${total}`,  f:'สถานะ Inprogress'},
    {ic:I.trending, c:'#4A72D6', t:'#EAF0FD', l:'ความคืบหน้าเฉลี่ย', v:avg.toFixed(1),  u:'%',           f:'ค่าเฉลี่ยของโครงการที่กรองอยู่'},
    {ic:riskIco,    c:riskCol,   t:riskTint,  l:'โครงการเสี่ยง',    v:risk,              u:'',            f:riskFoot},
    {ic:I.money,    c:'#7A4BB5', t:'#F1EAFB', l:'มูลค่าสัญญารวม',  v:thb(value),        u:'THB',         f:'Contract Value', money:true},
  ];
  document.getElementById('kpis').innerHTML = items.map(k=>`
    <div class="kpi" style="--kc:${k.c};--kt:${k.t}">
      <div class="kpi-top">
        <div class="kpi-ico">${svg(k.ic)}</div>
        <div class="kpi-label">${k.l}</div>
      </div>
      <div class="kpi-val ${k.money?'money':''}">${k.v}${k.u?`<span class="u">${k.u}</span>`:''}</div>
      <div class="kpi-foot">${k.f}</div>
    </div>`).join('');
}

function renderPM(list){
  const g = {};
  list.forEach(p=>{
    const pm = p['PM Name'] || 'ไม่ระบุ';
    (g[pm] ||= {pm, team:p['Team']||'', n:0, sum:0, val:0, warn:0, crit:0});
    g[pm].n++;
    g[pm].sum += num(p['%Progress']);
    g[pm].val += num(p['PM Accountable Value']);
    const hc = H.cls(p['Project Health']);
    if(hc === 'critical') g[pm].crit++;
    else if(hc === 'warning') g[pm].warn++;
  });
  const rows = Object.values(g).sort((a,b)=> (b.crit-a.crit) || (b.warn-a.warn) || (b.val-a.val));
  document.getElementById('pmCount').textContent = `${rows.length} คน`;
  document.getElementById('pmBody').innerHTML = rows.map(r=>{
    const avg = r.n ? r.sum/r.n : 0;
    const col = avg>=70 ? '#128A5E' : avg>=40 ? '#4A72D6' : '#B87A0A';
    return `<tr>
      <td><div class="who">
        <div class="av" style="background:${avatarColor(r.pm)}">${initials(r.pm)}</div>
        <div><div class="who-n">${r.pm}</div><div class="who-t">${r.team}</div></div>
      </div></td>
      <td class="r"><span class="pct">${r.n}</span></td>
      <td>
        <span class="pct">${avg.toFixed(1)}%</span>
        <div class="bar"><i style="width:${Math.min(avg,100)}%;background:${col}"></i></div>
      </td>
      <td class="r"><span class="money">${thb(r.val)}</span></td>
      <td class="r"><div class="risks">${
        (r.crit || r.warn)
          ? `${r.crit ? `<span class="chip critical" title="Critical ${r.crit} โครงการ">${svg(I.octagon)}${r.crit}</span>` : ''}${
               r.warn ? `<span class="chip warning" title="Warning ${r.warn} โครงการ">${svg(I.alert)}${r.warn}</span>` : ''}`
          : `<span class="chip success" title="ไม่มีโครงการเสี่ยง">${svg(I.check)}0</span>`
      }</div></td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="empty">ไม่มีข้อมูลตรงตามตัวกรอง</td></tr>`;
}

function renderDonut(list){
  const g = {};
  list.forEach(p=>{
    const l = H.label(p['Project Health']);
    (g[l] ||= {l, c:H.cls(p['Project Health']), n:0}).n++;
  });
  const es = Object.values(g).sort((a,b)=>b.n-a.n);
  const total = list.length || 1;
  document.getElementById('healthCount').textContent = `${list.length} โครงการ`;

  const cx=74, cy=74, r=52, w=19;
  let a = -90;
  const segs = es.map(e=>{ const s=a; a += (e.n/total)*360; return {...e, s, e2:a}; });
  const pol = (deg,rr)=>[cx+rr*Math.cos(deg*Math.PI/180), cy+rr*Math.sin(deg*Math.PI/180)];

  document.getElementById('donut').innerHTML =
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E9EDF5" stroke-width="${w}"/>` +
    segs.map(s=>{
      const span = s.e2 - s.s;
      if (span <= 0.01) return '';
      if (span >= 359.9)
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${H.color(s.c)}" stroke-width="${w}"/>`;
      const [x1,y1]=pol(s.s,r), [x2,y2]=pol(s.e2,r);
      return `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${span>180?1:0} 1 ${x2} ${y2}" fill="none" stroke="${H.color(s.c)}" stroke-width="${w}"/>`;
    }).join('') +
    `<text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#16203A" font-family="Plus Jakarta Sans" font-size="25" font-weight="800">${list.length}</text>
     <text x="${cx}" y="${cy+16}" text-anchor="middle" fill="#98A3BC" font-family="Inter" font-size="10">โครงการ</text>`;

  document.getElementById('legend').innerHTML = es.map(e=>`
    <div class="lg">
      <span class="sw" style="background:${H.color(e.c)}"></span>${e.l}
      <span class="n">${e.n}</span><span class="p">${((e.n/total)*100).toFixed(0)}%</span>
    </div>`).join('') || `<div class="lg">ไม่มีข้อมูล</div>`;
}

function renderCards(list){
  document.getElementById('projCount').textContent = `${list.length} / ${ALL.length}`;
  const el = document.getElementById('grid');
  if(!list.length){ el.innerHTML = `<div class="empty" style="grid-column:1/-1">ไม่มีโครงการตรงตามตัวกรองที่เลือก</div>`; return; }

  el.innerHTML = list.map(p=>{
    const c = H.cls(p['Project Health']);
    const col = H.color(c);
    const pr = Math.min(num(p['%Progress']),100);
    return `<div class="card" style="--cc:${col}">
      <div class="c-top">
        <div style="min-width:0">
          <span class="c-code">${svg(I.hash)}${p[' Project Code']||p['Project Code']||'-'}</span>
          <div class="c-name">${p['Project Name']||'ไม่ระบุชื่อโครงการ'}</div>
          <div class="c-cust">${svg(I.building)}${p['Customer']||'-'}</div>
        </div>
        <span class="chip ${c}">${svg(H.icon(c))}${H.label(p['Project Health'])}</span>
      </div>
      <div class="c-meta">
        <span class="tag">${svg(I.user)}${p['PM Name']||'-'}</span>
        <span class="tag">${svg(I.play)}${p['Status']||'-'}</span>
        ${num(p['Contract Value']) ? `<span class="tag">${svg(I.money)}${compact(p['Contract Value'])}</span>` : ''}
      </div>
      <div class="c-prog">
        <div class="c-prog-t"><span>ความคืบหน้า</span><b>${pr.toFixed(1)}%</b></div>
        <div class="c-bar"><i style="width:${pr}%;background:${col}"></i></div>
      </div>
      ${p['Progress Update'] ? `<div class="c-note">${p['Progress Update']}</div>` : ''}
      <div class="c-foot">
        <span>${svg(I.cal)}${fmtDate(p['Start Date'])} - ${fmtDate(p['End Date'])}</span>
        <span>${svg(I.clock)}${fmtDate(p['Update Date'])}</span>
      </div>
    </div>`;
  }).join('');
}

function render(){
  buildFilters();
  document.getElementById('hProjects').textContent = ALL.length;
  document.getElementById('hPMs').textContent = uniq(ALL.map(p=>p['PM Name'])).length;
  renderFiltered();
}
function renderFiltered(){
  const f = applyFilters(ALL);
  renderKPIs(f); renderPM(f); renderDonut(f); renderCards(f);
}

async function syncNow(){
  const btn = document.getElementById('syncBtn'), txt = document.getElementById('syncTxt');
  btn.disabled = true; txt.textContent = 'กำลังสั่งซิงก์...';
  try{
    await fetch(MAKE_WEBHOOK, { method:'POST', mode:'no-cors' });
    txt.textContent = 'รอข้อมูลใหม่...';
    await new Promise(r=>setTimeout(r,6000));
    await loadData();
    txt.textContent = 'ซิงก์แล้ว';
  }catch(e){ txt.textContent = 'ซิงก์ไม่สำเร็จ'; }
  finally{ setTimeout(()=>{ txt.textContent = 'ซิงก์ข้อมูล'; btn.disabled = false; }, 2500); }
}

loadData();
document.getElementById('syncBtn').addEventListener('click', syncNow);
</script>
